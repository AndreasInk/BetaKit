name: BetaFeedbackDemo

options:
  bundleIdPrefix: dev.andreasink
  deploymentTarget:
    iOS: "17.0"

packages:
  BetaFeedbackKit:
    path: ../..

targets:
  BetaFeedbackDemo:
    type: application
    platform: iOS
    sources:
      - path: Sources/BetaFeedbackDemo
    dependencies:
      - package: BetaFeedbackKit
        product: BetaFeedbackKit
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: 1.0
        PRODUCT_BUNDLE_IDENTIFIER: dev.andreasink.BetaFeedbackDemo
        PRODUCT_NAME: BetaFeedbackDemo
        SWIFT_VERSION: 6.0
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Supporting/Info.plist
      properties:
        CFBundleDisplayName: Beta Feedback Demo
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
